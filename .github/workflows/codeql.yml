name: codeql

# GitHub's own security scanner (free for public repositories): results appear under the repository's Security tab.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"          # weekly, so new vulnerability rules also check code that has not changed

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none          # both are scanned from source, nothing to build
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

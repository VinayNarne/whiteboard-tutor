name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:                      # the suite runs every database test twice: SQLite and a throwaway Postgres database
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/learning_platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python packages
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Install the lesson board's layout helper (elkjs, MathJax, handwriting font)
        run: npm ci --prefix engine/scene_layout
      - name: Install the browser for the browser tests
        run: python -m playwright install --with-deps chromium
      - name: Run the tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Type-check and build
        run: npm run build --prefix frontend
